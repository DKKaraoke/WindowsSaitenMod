<!-- index.html -->
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta http-equiv="content-security-policy" content="script-src 'self' 'unsafe-inline'" />
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: rgba(0, 0, 0, 0);
        }

        .card-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .parameter-card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            padding: 0px;
            padding-top: 0px;
            padding-bottom: 10px;
            width: 130px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .parameter-card h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 10px;
        }

        .parameter-card input[type="range"] {
            width: 100%;
            margin: 10px 0;
        }

        .parameter-card .value {
            font-size: 16px;
            font-weight: bold;
            color: #555;
        }
    </style>
</head>

<body style="margin: 0;">
    <div id="content" style="width: 100%;"></div>
    <br>
    <div class="card-container" id="card-container">
    </div>
    <script src="renderer.js"></script>
</body>

</html>
